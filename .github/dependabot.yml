version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The browser frontend resolves as its own workspace with its own lockfile
  # (it is wasm32-only, so it cannot be a member of the root one), which means
  # cargo has to be told about it separately.
  - package-ecosystem: "cargo"
    directory: "/web/wasm"
    schedule:
      interval: "weekly"
    groups:
      wasm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
