<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="zoetrope">
<!-- The mark at favicon size, and the source of web/public/favicon.svg —
     assets/build.sh copies it there, so edit this one.

     Not a scaled assets/mark.svg: at 16px the node
     boxes and their labels turn to grey mush, so the session survives as three
     dots and a pair of edges — the shape of a run, without its contents. Eight
     slits rather than twenty-four, for the same reason. -->
<rect width="32" height="32" rx="6" fill="#121212"/>

<g fill="none" stroke-width="3.5" stroke-dasharray="5.8 2.84">
  <path d="M16 5 A 11 11 0 1 1 16 27 A 11 11 0 1 1 16 5" stroke="#585858"/>
  <path d="M16 5 A 11 11 0 0 1 25.5 21.5" stroke="#d7af00" opacity="0.55"/>
</g>
<line x1="16" y1="2.5" x2="16" y2="7" stroke="#d7af00" stroke-width="2.6" stroke-linecap="round" transform="rotate(120 16 16)"/>

<g fill="none" stroke="#585858" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <path d="M16 12.8 V15.5 H11.5 V17.8"/>
  <path d="M16 12.8 V15.5 H20.5 V17.8"/>
</g>
<circle cx="16" cy="11" r="1.9" fill="#87d787"/>
<g fill="#d0d0d0" opacity="0.7">
  <circle cx="11.5" cy="19.5" r="1.7"/>
  <circle cx="20.5" cy="19.5" r="1.7"/>
</g>
</svg>
